<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitácora de Mantenimiento</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="manifest" href="./manifest.json">
</head>
<body>
  <header>
    <h1>Bitácora de Mantenimiento</h1>
    <span id="badge-red" class="badge online">En Línea</span>
  </header>

  <main>
    <section class="card">
      <h2>Nuevo reporte</h2>
      <form id="form-incidencia">
        <input type="text" id="titulo" placeholder="Equipo (ej. Bomba B-12)" required>
        <textarea id="descripcion" placeholder="¿Qué pasó?" required></textarea>
        <button type="submit">Guardar reporte</button>
      </form>
    </section>

    <section class="card">
      <div class="header-lista">
        <h2>Bandeja de salida</h2>
        <button id="btn-purgar" type="button">Limpiar enviados</button>
      </div>
      <ul id="lista-outbox"></ul>
    </section>
  </main>

  <script src="./db-helper.js"></script>
  <script src="./app.js"></script>
</body>
</html>
